name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PMTILES_RELEASE_TAG: osm-power-2026-07-25-schema1
  BASEMAP_RELEASE_TAG: osm-basemap-2026-07-25-schema1

jobs:
  build:
    name: Assemble verified site artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble tracked site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data/grid-atlas/osm-power
          mkdir -p _site/data/grid-atlas/osm-basemap
          git archive --format=tar HEAD | tar -xf - -C _site

      - name: Download pinned power PMTiles release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            europa.pmtiles
            estados-unidos.pmtiles
            china.pmtiles
            japon.pmtiles
            corea-del-sur.pmtiles
            taiwan.pmtiles
          )
          for asset in "${assets[@]}"; do
            gh release download "$PMTILES_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "_site/data/grid-atlas/osm-power" \
              --pattern "$asset"
          done

      - name: Download pinned basemap PMTiles release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            world.pmtiles
            europa.pmtiles
            estados-unidos.pmtiles
            china.pmtiles
            japon.pmtiles
            corea-del-sur.pmtiles
            taiwan.pmtiles
          )
          for asset in "${assets[@]}"; do
            gh release download "$BASEMAP_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "_site/data/grid-atlas/osm-basemap" \
              --pattern "$asset"
          done

      - name: Verify power PMTiles size and SHA-256
        run: >-
          node scripts/grid-atlas/osm-self-hosted/verify-pmtiles-manifest.mjs
          --manifest _site/data/grid-atlas/osm-power-manifest.json
          --asset-root _site/data/grid-atlas/osm-power

      - name: Verify basemap PMTiles size and SHA-256
        run: >-
          node scripts/grid-atlas/osm-self-hosted/verify-osm-basemap-manifest.mjs
          --manifest _site/data/grid-atlas/osm-basemap-manifest.json
          --asset-root _site/data/grid-atlas/osm-basemap

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
